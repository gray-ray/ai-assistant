server:
  port: 8900

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

spring:
  application:
    name: ai-assistant

  datasource:
    url: jdbc:mysql://localhost:3306/ai_assistant
      ?useUnicode=true
      &characterEncoding=utf8
      &serverTimezone=Asia/Shanghai
      &useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# 文件上传相关配置
  servlet:
    multipart:
      enabled: true
      # 单个文件最大 500MB
      max-file-size: 500MB
      # 单次请求最大 500MB
      max-request-size: 500MB
#  用来将上传文件存储在本地的相关配置
  web:
    resources:
      # 不添加默认静态资源映射，自己的 /upload 映射在 WebMvcConfig 里单独加
      add-mappings: false

  ai:
    # -------- DeepSeek: chat 模型 --------
    deepseek:
      api-key: sk-18245f29dec5489e97bab0188ae5e2af
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.2
      base-url: https://api.deepseek.com

    # ================================================================
    # Ollama 本地 embedding 模型 (bge-m3) —— 必须在应用启动前可用！
    # ----------------------------------------------------------------
    # ⚠️  启动前提：
    #   1. 安装 Ollama          → https://ollama.com
    #   2. 拉取 bge-m3 模型      → ollama pull bge-m3
    #      （bge-m3：多语言、中文效果优秀，向量维度 1024）
    #   3. 确保 Ollama 服务运行   → http://localhost:11434
    #
    # ⚠️  说明：
    #   - 聊天模型使用 DeepSeek（见上方 deepseek 配置），Ollama 的 chat 已禁用
    #   - 如果 Ollama 未启动或 bge-m3 未拉取，应用将启动失败，
    #     这是预期行为——避免向量化流程静默使用无效数据。
    #   - 想换 embedding 模型，改下方 options.model 即可
    #     （如 mxbai-embed-large / nomic-embed-text / shaw/dmeta-embedding-zh 等）。
    # ================================================================
    ollama:
      base-url: http://localhost:11434
      chat:
        enabled: false
      embedding:
        options:
          model: bge-m3

# ================================================================
# Milvus 向量数据库配置（已注释，改用 Spring AI SimpleVectorStore）
# ----------------------------------------------------------------
# ⚠️  如需重新启用 Milvus：
#   1. 取消 pom.xml 中 milvus-sdk-java 依赖的注释
#   2. 取消 MilvusConfig / MilvusProperties / MilvusVectorStoreService 类上的注释
#   3. 取消本配置块的注释
#   4. 启动 Milvus 服务（默认 localhost:19530）
# ================================================================
#milvus:
#  enabled: true
#  host: localhost
#  port: 19530
#  # 可选：Token 鉴权（Milvus 2.4+ 云版或开启鉴权时使用）
#  # token: root:Milvus
#  database: default
#  # Collection 名称
#  collection-name: doc_chunks
#  # 向量维度（bge-m3 输出维度为 1024）
#  dimension: 1024
#  # 索引类型：AUTOINDEX / IVF_FLAT / IVF_SQ8 / HNSW / DISKANN
#  index-type: AUTOINDEX
#  # 相似度度量：IP（内积）/ L2（欧氏距离）/ COSINE
#  metric-type: COSINE
#  # 启动时若 collection 不存在则自动建表建索引
#  auto-create-collection: true

# ======== 业务自定义配置 ========
ai:
  embedding:
    # 单次批量向量化的 chunk 数。大 PDF + 本地 Ollama/GPU 场景下建议从 1 开始，稳定后再逐步调大。
    batch-size: 1
  vector-store:
    # 是否在日志中打印示例向量的前几维（调试用，生产关闭）
    log-sample-vector: false
    # 向量持久化目录（相对路径或绝对路径）
    # 留空则仅使用内存模式，重启后数据丢失；配置后启动自动加载，写入同步落盘
    persistence-path: ./vector-store
  # ======== 向量检索 & TopK 召回配置 ========
  vector-search:
    top-k-per-query: 4         # 单查询 TopK：每条 query 召回的候选片段数
    final-top-n: 6             # 合并后最终 TopN：多查询合并去重后返回的最大片段数
    min-score: 0.5             # 最低相似度阈值（余弦相似度，范围 [-1, 1]）
    enable-metadata-filter: true  # 是否启用元数据过滤
  # ======== Rerank 重排配置 ========
  rerank:
    enabled: false                  # 总开关：true 启用 bge-reranker，false 使用透传（Noop）
    model: bge-reranker-v2-m3       # 模型名（仅用于日志标识）
    base-url: http://localhost:8000 # Python rerank 服务地址（FastAPI /rerank 接口）
    top-m: 4                        # 重排后返回条数（TopM）
    min-score: 0.3                  # 最低 rerank 分数阈值（0~1，含）
    batch-size: 8                   # 单次调用 reranker 的 passage 批量大小
    timeout-ms: 5000                # HTTP 调用超时（毫秒）
    always-rerank: false            # 输入少于 topM 时是否仍执行重排
    fusion:
      enabled: false                # 是否开启向量分数加权融合
      alpha: 0.7                    # rerank 分数权重（vector 权重 = 1 - alpha）
  # ======== RAG 上下文组装配置 ========
  rag:
    context:
      max-chunks: 5                 # 最终送入上下文的最大片段数（硬上限）
      max-tokens: 3000              # 上下文 token 预算上限（贪心截断）
      min-score: null               # 额外分数阈值（null 表示沿用检索/rerank 层阈值）
      format: numbered              # 组装格式：numbered / markdown / plain
    # ======== 回答事实校验（Groundedness Check）配置 ========
    groundedness:
      enabled: true                 # 总开关：true 启用回答事实校验
      threshold: 0.7                # 支撑度阈值（0~1），低于此值视为"严重不支撑"并追加警示
      mark-unsupported: true        # 在未被文档支撑的句子后追加 ⚠️ 标记
      fail-open: true               # 校验异常时是否放行原回答（true=放行，false=返回警示）
      timeout-ms: 10000             # 校验调用超时（毫秒）
